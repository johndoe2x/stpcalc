<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>STP Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7f9;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #007bff;
      color: white;
      border: none;
      padding: 10px 20px;
      margin-top: 20px;
      width: 100%;
      border-radius: 5px;
      font-size: 16px;
    }
    button:hover {
      background-color: #0056b3;
    }
    .result, .details, .suggestion {
      margin-top: 20px;
      padding: 15px;
      background-color: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: center;
    }
    th {
      background-color: #e9ecef;
    }
  </style>
</head>
<body>
  <h1>STP Investment Calculator</h1>

  <label for="initialInvestment">Initial Investment in Liquid Fund (₹):</label>
  <input type="number" id="initialInvestment" value="1000000">

  <label for="liquidReturn">Annual Return from Liquid Fund (%):</label>
  <input type="number" id="liquidReturn" step="0.01" value="6.25">

  <label for="monthlyTransfer">Monthly Transfer to SIP (₹):</label>
  <input type="number" id="monthlyTransfer" value="5000">

  <label for="months">Number of Months for Transfer:</label>
  <input type="number" id="months" value="12">

  <label for="sipReturn">Annual Return on SIP (%):</label>
  <input type="number" id="sipReturn" step="0.01" value="12">

  <button onclick="calculateSTP()">Calculate</button>

  <div class="result" id="result"></div>
  <div class="suggestion" id="suggestion"></div>
  <div class="details" id="details"></div>

  <script>
    function calculateRequiredInvestment(monthlyTransfer, months, monthlyRate) {
      let required = 0;
      for (let i = 0; i < months; i++) {
        required = (required + monthlyTransfer) / (1 + monthlyRate);
      }
      return required;
    }

    function calculateSTP() {
      const initialInvestment = parseFloat(document.getElementById('initialInvestment').value);
      const liquidReturn = parseFloat(document.getElementById('liquidReturn').value) / 100;
      const monthlyTransfer = parseFloat(document.getElementById('monthlyTransfer').value);
      const months = parseInt(document.getElementById('months').value);
      const sipReturn = parseFloat(document.getElementById('sipReturn').value) / 100;

      const monthlyLiquidRate = liquidReturn / 12;

      let liquidFund = initialInvestment;
      let sipValue = 0;
      let liquidInterestEarned = 0;
      let sipInvested = 0;
      let tableRows = "";

      // Calculate how many months the fund can sustain the SIP
      let balance = initialInvestment;
      let monthsAvailable = 0;
      const maxIterations = 240;
      while (balance > 0 && monthsAvailable < maxIterations) {
        const interest = balance * monthlyLiquidRate;
        balance += interest - monthlyTransfer;
        if (balance < 0) break;
        monthsAvailable++;
      }

      // SIP Value growth with yearly compounding
      for (let i = 1; i <= months && i <= 240; i++) {
        const interest = liquidFund * monthlyLiquidRate;
        liquidFund += interest - monthlyTransfer;
        liquidInterestEarned += interest;

        sipValue += monthlyTransfer;
        sipInvested += monthlyTransfer;

        if (i % 12 === 0) {
          sipValue *= (1 + sipReturn); // yearly compounding
        }

        tableRows += `<tr>
          <td>${i}</td>
          <td>₹${interest.toFixed(2)}</td>
          <td>₹${liquidFund.toFixed(2)}</td>
          <td>₹${sipValue.toFixed(2)}</td>
        </tr>`;
      }

      const sipGain = sipValue - sipInvested;
      const totalValue = liquidFund + sipValue;
      const inflationRate = 0.06;
      const inflationAdjustedAmount = initialInvestment * Math.pow(1 + inflationRate, months / 12);

      document.getElementById('result').innerHTML = `
        <strong>Results after ${months} months:</strong><br>
        💰 Final Liquid Fund Balance: ₹${liquidFund.toFixed(2)}<br>
        💸 Total Interest Earned from Liquid Fund: ₹${liquidInterestEarned.toFixed(2)}<br>
        💳 Final SIP Value: ₹${sipValue.toFixed(2)}<br>
        💰 SIP Invested: ₹${sipInvested.toFixed(2)}<br>
        💵 SIP Gain: ₹${sipGain.toFixed(2)}<br>
        💡 Based on ₹${monthlyTransfer.toFixed(0)} SIP, your liquid fund can sustain for approximately <strong>${monthsAvailable} months</strong> at ${(liquidReturn * 100).toFixed(2)}% annual return.<br>
        💡 To sustain a ₹${monthlyTransfer.toFixed(0)} SIP for ${months} months at ${(liquidReturn * 100).toFixed(2)}% annual return, you would need an initial investment of approximately ₹${calculateRequiredInvestment(monthlyTransfer, months, monthlyLiquidRate).toFixed(0)}.<br>
        📉 Due to 6% annual inflation, ₹${initialInvestment.toFixed(0)} today will be equivalent to ₹${inflationAdjustedAmount.toFixed(0)} after ${months} months.<br>
        <hr>
        🌐 <strong>Total Portfolio Value: ₹${totalValue.toFixed(2)}</strong>
      `;

      document.getElementById('details').innerHTML = `
        <h3>Month-by-Month Breakdown (First ${Math.min(months, 240)} Months)</h3>
        <table>
          <tr>
            <th>Month</th>
            <th>Interest Earned</th>
            <th>Liquid Fund Balance</th>
            <th>SIP Value</th>
          </tr>
          ${tableRows}
        </table>
      `;
    }
  </script>
</body>
</html>
